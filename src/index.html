<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="description" content="A real-time map of the news, arranged by how readers feel and what they care about.">
  <meta name="moodwire-api-base" content="">
  <title>Moodwire — The living news grid</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101218'/%3E%3Cpath d='M14 42V30h9v12zm14 0V14h9v28zm14 0V23h9v19z' fill='%23d8ff3e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="newsroom-shell" id="top">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Moodwire home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>MOODWIRE</span>
      </a>
      <p class="edition" id="date-stamp">LIVE EDITION</p>
      <div class="live-status" aria-live="polite">
        <span class="live-pulse" aria-hidden="true"></span>
        <strong id="feed-state">CONNECTING</strong>
        <span class="reader-count"><b>30</b> simulated readers + you</span>
      </div>
    </header>

    <h1 class="sr-only" id="page-title">Moodwire live emotional news map</h1>
    <section class="map" aria-labelledby="page-title">
      <div class="axis-row" aria-hidden="true">
        <span><i class="axis-swatch happy"></i>HAPPIER</span>
        <span><i class="axis-swatch neutral"></i>NEUTRAL</span>
        <span><i class="axis-swatch sad"></i>SADDER</span>
      </div>
      <div class="map-body">
        <div class="vertical-axis" aria-hidden="true"><span>MOST FELT</span><i></i><span>EMERGING</span></div>
        <div class="story-stage" id="story-grid" aria-busy="true">
          <div class="grid-loading" id="grid-loading">
            <span class="loading-mark"><i></i><i></i><i></i></span>
            <p>Gathering the front pages…</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p><span id="source-total">20</span> established feeds · <span id="feed-note">checked every minute</span></p>
      <p id="refresh-time">Waiting for the first signal</p>
    </footer>
  </main>

  <output class="toast" id="toast" aria-live="polite" aria-atomic="true"></output>
  <noscript><p class="noscript">Moodwire needs JavaScript to keep the news grid moving without a refresh.</p></noscript>
</body>
</html>
